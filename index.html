    import { createRoot as __createRoot } from 'react-dom/client';

/* === COLE AQUI O CONTEÚDO DO COMPONENTE === */
/* placeholder — será substituído pelo bash */
    import React, { useState, useMemo } from 'react';

    // --- Pacotes tecnológicos ---

    // ============================================================
    // MOTOR DE EVENTOS PROBABILÍSTICOS
    // ============================================================
    // Cada evento tem: fase em que pode ocorrer, função de probabilidade
    // dependente das decisões, e função de impacto sobre o estado.

    // ============================================================
    // REGIMES CLIMÁTICOS ENSO (El Niño / La Niña)
    // ============================================================
    // Multiplicadores baseados em comportamento histórico:
    // Em El Niño bem caracterizado, veranico de 16+ dias no MT é evento raro (<10% das safras).
    // Em La Niña forte, veranico é quase certo (>60% das safras).
    const ENSO_REGIMES = {
      ninho_forte: {
        label: 'El Niño forte',
        cor: '#C44536',
        descricaoCurta: 'Alto risco de veranico e calor no MT',

        hedgeHint: 'Risco alto de quebra. Hedge mínimo (0-15%) — não se comprometa com entrega física que pode não acontecer.',

      },
      ninho_fraco: {
        label: 'El Niño fraco',

        descricaoCurta: 'Chuva irregular, risco moderado de veranico',

      },
      neutro: {
        label: 'ENSO Neutro',
        cor: '#7a7a68',
        descricaoCurta: 'Padrão climático normal',
        impactoMT: 'Sem viés climático significativo. Probabilidades seguem a média histórica do MT. A distribuição das chuvas no período crítico (nov–fev) é o que decide a safra.',
        hedgeHint: 'Cenário base. Hedge entre 30-50% é o padrão da maioria dos produtores.',

      },
      ninha_fraca: {
        label: 'La Niña fraca',
        cor: '#6B9DBE',
        descricaoCurta: 'Chuvas geralmente regulares no MT',
        impactoMT: 'Ao contrário do Sul do país (que sofre seca em La Niña), o Centro-Oeste costuma ter chuvas mais regulares. Cenário tipicamente favorável pra produtividade no MT.',
        hedgeHint: 'Cenário positivo pro MT. Hedge moderado-alto (50-65%) é razoável.',
        multipliers: { chuva_plantio: 1.20, veranico_floracao: 0.40, seca_enchimento: 0.50, chuva_excelente: 1.30, chuva_colheita: 1.40 }
      },
      ninha_forte: {
        label: 'La Niña forte',
        cor: '#4A8FBC',
        descricaoCurta: 'Chuvas abundantes no MT (risco fica no Sul)',
        impactoMT: 'La Niña forte concentra chuva no Centro-Oeste. Pro MT é geralmente bom pra produtividade — o risco maior fica no Sul (RS/PR). Único cuidado: excesso de chuva pode atrapalhar a colheita e favorecer doenças.',
        hedgeHint: 'Forecast favorável: hedge agressivo (60-80%) faz sentido. Risco de quebra baixo no MT.',
        multipliers: { chuva_plantio: 1.50, veranico_floracao: 0.15, seca_enchimento: 0.20, chuva_excelente: 1.60, chuva_colheita: 1.80 }
      }
    };

    // Sorteia regime + forecast com nível de confiança realista
    function sortearENSO() {
      const r = Math.random();
      let actual;
      if (r < 0.12) actual = 'ninho_forte';
      else if (r < 0.32) actual = 'ninho_fraco';
      else if (r < 0.62) actual = 'neutro';
      else if (r < 0.82) actual = 'ninha_fraca';
      else actual = 'ninha_forte';

      const confidence = 0.60 + Math.random() * 0.32; // 60-92%
      let forecast;
      if (Math.random() < confidence) {
        forecast = actual;
      } else {
        const ordered = ['ninho_forte', 'ninho_fraco', 'neutro', 'ninha_fraca', 'ninha_forte'];
        const idx = ordered.indexOf(actual);
        const dir = Math.random() < 0.5 ? -1 : 1;
        forecast = ordered[Math.max(0, Math.min(ordered.length - 1, idx + dir))];
      }
      return { actual, forecast, confidence: Math.round(confidence * 100) };
    }

    // ============================================================
    // DERIVA NATURAL DO MERCADO ENTRE FASES (random walk + sazonalidade)
    // ============================================================
    // Magnitudes calibradas pela volatilidade histórica:
    // - PTAX: ~2-3% ao mês → ±3-5% em transições de 1-3 meses
    // - Soja B3: ~3-5% ao mês → ±4-6% por transição
    // - Basis MT: piora -R$2 a -R$3 aproximando colheita; melhora +R$2 a +R$4 na entressafra
    const DRIFT_BY_FASE = {
      'setup-plantio':           { meses: 1,   ptax: 0.025, cbot: 0.025, basisSazonal: 0.5,  basisRand: 1.0 },
      'plantio-eventos':         { meses: 2,   ptax: 0.035, cbot: 0.045, basisSazonal: -0.8, basisRand: 1.2 },
      'setup-manejo':            { meses: 1,   ptax: 0.022, cbot: 0.030, basisSazonal: -0.8, basisRand: 1.0 },
      'vegetativo-eventos':      { meses: 1,   ptax: 0.025, cbot: 0.035, basisSazonal: -1.5, basisRand: 1.5 },
      'enchimento-eventos':      { meses: 1,   ptax: 0.025, cbot: 0.035, basisSazonal: -2.0, basisRand: 1.5 },
      'colheita-eventos':        { meses: 2,   ptax: 0.035, cbot: 0.040, basisSazonal: -2.5, basisRand: 2.0 },
      'setup-venda':             { meses: 0.5, ptax: 0.015, cbot: 0.018, basisSazonal: 1.0,  basisRand: 1.0 },
      'comercializacao-eventos': { meses: 3,   ptax: 0.045, cbot: 0.055, basisSazonal: 3.5,  basisRand: 2.5 }
    };

    function aplicarDeriva(simState, faseAlvo) {
      const cfg = DRIFT_BY_FASE[faseAlvo];
      if (!cfg) return simState;
      // Movimento uniforme em [-max, +max] — random walk simples
      const ptaxMove = (Math.random() - 0.5) * 2 * cfg.ptax;
      const cbotMove = (Math.random() - 0.5) * 2 * cfg.cbot;
      const basisMove = cfg.basisSazonal + (Math.random() - 0.5) * 2 * cfg.basisRand;
      return {
        ...simState,
        modPtax: simState.modPtax * (1 + ptaxMove),
        modCbot: simState.modCbot * (1 + cbotMove),
        modBasis: simState.modBasis + basisMove
      };
    }

    // Atualiza forecast e confiança ao longo da safra.
    // Em vida real, forecasts ENSO são atualizados mensalmente (CFS/NOAA, INMET, ECMWF).
    // Confidence sobe naturalmente conforme novos dados chegam.
    // Se o forecast inicial estava errado, ele tende a se aproximar do regime real.
    function atualizarForecast(enso, faseDestino, rng = Math.random) {
      const boostPorFase = {
        'setup-plantio':           5,
        'plantio-eventos':         7,
        'setup-manejo':            9,
        'vegetativo-eventos':     12,
        'enchimento-eventos':      7,
        'colheita-eventos':        3,
        'setup-venda':             2,
        'comercializacao-eventos': 0
      };
      const boost = boostPorFase[faseDestino] || 0;
      if (boost === 0 && enso.forecast === enso.actual) {
        return { ...enso, revisedThisPhase: false };
      }
      const novaConfianca = Math.min(97, (enso.confidence || 70) + boost);

      // Revisão só rola em fases de eventos (pra aparecer junto dos outros eventos)
      // e só se o forecast estiver diferente do regime real
      const ehFaseDeEventos = faseDestino.endsWith('-eventos');
      let novoForecast = enso.forecast;
      let revisedThisPhase = false;
      let prevForecast = enso.prevForecast || null;

      if (ehFaseDeEventos && enso.forecast !== enso.actual && boost > 0) {
        // Probabilidade de revisão cresce com o boost
        const chance = (boost / 100) * 2.8;
        if (rng() < chance) {
          const ordem = ['ninho_forte', 'ninho_fraco', 'neutro', 'ninha_fraca', 'ninha_forte'];
          const fIdx = ordem.indexOf(enso.forecast);
          const aIdx = ordem.indexOf(enso.actual);
          const direcao = aIdx > fIdx ? 1 : -1;
          novoForecast = ordem[fIdx + direcao];
          revisedThisPhase = true;
          prevForecast = enso.forecast;
        }
      }

      return {
        actual: enso.actual,
        forecast: novoForecast,
        confidence: novaConfianca,
        revisedThisPhase,
        prevForecast
      };
    }

    const EVENTOS = [
      // --- PLANTIO ---
      {
        id: 'chuva_plantio',

      },
      {

        prob: () => 0.55,

        icon: Bug,
        tipo: 'fito',
        desc: 'Esporos detectados na região. Manejo fito faz diferença agora.',
        impactoTexto: (d) => `−${(22 * (1 - MANEJOS[d.manejo].eficacia)).toFixed(1)}% na produtividade (eficácia do seu manejo: ${(MANEJOS[d.manejo].eficacia*100).toFixed(0)}%)`,
        explicacao: 'A ferrugem asiática (Phakopsora pachyrhizi) é um fungo que ataca as folhas da soja, impedindo a fotossíntese. Sem folha viva, a planta não enche o grão. É o evento que mais justifica investir em manejo — reativo perde ~13%, premium perde só 1,5%.',

      {

      // --- ENCHIMENTO DE GRÃO ---
      {
        id: 'seca_enchimento',
        fase: 'enchimento',
        prob: (d) => d.plantio === 'cedo' ? 0.18 : d.plantio === 'medio' ? 0.12 : 0.22,

        aplicar: (s) => { s.modProd *= 0.88; }
      },
      {
        id: 'percevejo',
        fase: 'enchimento',
        prob: () => 0.40,

        icon: Bug,
        tipo: 'fito',
        desc: 'Pressão de percevejo marrom. Compromete qualidade do grão.',
        impactoTexto: (d) => `−${(8 * (1 - MANEJOS[d.manejo].eficacia)).toFixed(1)}% na produtividade`,
        explicacao: 'O percevejo marrom suga o grão em formação, deixando-o "manchado" ou "chocho". O dano por planta é menor que ferrugem, mas afeta qualidade do lote (e gera desconto no preço). Controle exige acompanhamento da fase final.',
        aplicar: (s, d) => { s.modProd *= (1 - 0.08 * (1 - MANEJOS[d.manejo].eficacia)); }
      },
      {
        id: 'chuva_excelente',
        fase: 'enchimento',
        prob: () => 0.25,
        titulo: 'Chuvas regulares no enchimento',
        icon: Droplets,
        tipo: 'positivo',

    // SIMULAÇÃO

    function rolarEventosDaFase(fase, decisoes, ensoActual, rng = Math.random) {
      const regime = ENSO_REGIMES[ensoActual] || ENSO_REGIMES.neutro;
      let eventos = EVENTOS
        .filter(e => e.fase === fase)
        .filter(e => {
          const baseProb = e.prob(decisoes);
          const mult = regime.multipliers[e.id] ?? 1.0; // só climáticos têm multiplier
          return rng() < baseProb * mult;
        });

      // Resolve conflitos: pares mutuamente exclusivos — se ambos saíram, mantém só um (sorteado)
      const paresExclusivos = [
        ['usda_baixa', 'usda_alta'],         // safra americana ↑ ou ↓, não os dois
        ['dolar_sobe', 'dolar_cai'],          // dólar sobe OU cai
        ['chuva_excelente', 'seca_enchimento'] // chuva ótima OU déficit no enchimento
      ];
      for (const [a, b] of paresExclusivos) {
        const hasA = eventos.some(e => e.id === a);
        const hasB = eventos.some(e => e.id === b);
        if (hasA && hasB) {
          const keep = rng() < 0.5 ? a : b;
          eventos = eventos.filter(e => (e.id !== a && e.id !== b) || e.id === keep);
        }
      }

      return eventos;
    }

    // Helper: custos comprometidos até o momento atual (qualquer fase do jogo)
    function calcularCustosAcumulados(decisoes, simState) {
      const area = decisoes.area;
      const custos = { insumos: 0, manejo: 0, seguro: 0, extras: 0, financeiro: 0, total: 0 };

      if (decisoes.pacote) custos.insumos = PACOTES[decisoes.pacote].custoHa * area;
      if (decisoes.manejo) custos.manejo = MANEJOS[decisoes.manejo].custoHa * area;
      if (decisoes.seguro && decisoes.pacote) {
        custos.seguro = SEGUROS[decisoes.seguro].custoPct * PACOTES[decisoes.pacote].custoHa * area;
      }
      custos.extras = (simState.custoExtra || 0) * area;
      if (decisoes.financiamento && (custos.insumos + custos.manejo) > 0) {
        custos.financeiro = FINANCIAMENTOS[decisoes.financiamento].custoFin * (custos.insumos + custos.manejo);
      }
      custos.total = custos.insumos + custos.manejo + custos.seguro + custos.extras + custos.financeiro;

      // Caixa: seguro e extras sempre saem do bolso. Insumos+manejo só saem se for "à vista".
      let caixaPago = custos.seguro + custos.extras;
      if (decisoes.financiamento === 'avista') {
        caixaPago += custos.insumos + custos.manejo;
      }
      const caixa = decisoes.capital - caixaPago;
      const dividaAcumulada = custos.total - caixaPago;

      const prodReal = decisoes.pacote ? PACOTES[decisoes.pacote].prod * simState.modProd : 0;
      const sacasTotal = prodReal * area;
      const custoPorSaca = sacasTotal > 0 ? custos.total / sacasTotal : 0;

      return { ...custos, caixa, caixaPago, dividaAcumulada, prodReal, sacasTotal, custoPorSaca };
    }

    function calcularDRE(decisoes, simState) {
      const pacote = PACOTES[decisoes.pacote];
      const fin = FINANCIAMENTOS[decisoes.financiamento];
      const seg = SEGUROS[decisoes.seguro];
      const manejo = MANEJOS[decisoes.manejo];
      const area = decisoes.area;

      // Produtividade final
      const prodPotencial = pacote.prod;
      const prodReal = Math.max(15, prodPotencial * simState.modProd);
      const sacasTotal = prodReal * area;

      // Custos
      const custoInsumos = pacote.custoHa * area;
      const custoManejo = manejo.custoHa * area;
      const custoSeguro = seg.custoPct * pacote.custoHa * area;
      const custoExtra = simState.custoExtra * area;
      const custoFinanceiro = fin.custoFin * (custoInsumos + custoManejo);

      // Quebra de safra → seguro paga
      const prodFrustrada = prodReal < prodPotencial * 0.70;
      const indenizacao = prodFrustrada
        ? seg.cobertura * (custoInsumos + custoManejo) * (1 - prodReal / prodPotencial)
        : 0;

      // Preço final
      const basisFinal = INITIAL_MARKET.basisMT + simState.modBasis;
      const futuroFinal = INITIAL_MARKET.futuroJulho * simState.modCbot * simState.modPtax;
      const precoSpot = futuroFinal + basisFinal;

      // === HEDGE COM ENTREGA FÍSICA ===
      // Sacas comprometidas no contrato são FIXAS, baseadas na produção ESPERADA (potencial do pacote),
      // não na produção real. Se quebrar a safra, precisa COMPRAR no mercado pra cumprir o contrato.
      const sacasEsperadas = prodPotencial * area;
      const sacasComprometidas = sacasEsperadas * decisoes.travado;
      const precoTravado = INITIAL_MARKET.futuroJulho + INITIAL_MARKET.basisMT;
      const receitaTravada = sacasComprometidas * precoTravado;

      // Backup: se prod real < sacas comprometidas, precisa comprar a diferença no spot atual
      const sacasFaltantes = Math.max(0, sacasComprometidas - sacasTotal);
      const custoBackup = sacasFaltantes * precoSpot;

      // Sacas livres: o que sobrou da produção real depois de honrar o contrato
      const sacasLivres = Math.max(0, sacasTotal - sacasComprometidas);
      let precoMedioLivre;
      if (decisoes.venda === 'colheita') {
        precoMedioLivre = precoSpot;
      } else if (decisoes.venda === 'armazenar') {
        precoMedioLivre = precoSpot * 1.04 - 3.50;
      } else {
        precoMedioLivre = precoSpot * 1.02 - 1.80;
      }
      const receitaLivre = sacasLivres * precoMedioLivre;

      const receitaBruta = receitaTravada + receitaLivre + indenizacao;
      const custoTotal = custoInsumos + custoManejo + custoSeguro + custoExtra + custoFinanceiro + custoBackup;
      const lucro = receitaBruta - custoTotal;
      const lucroHa = lucro / area;
      const roe = lucro / decisoes.capital;

      // Sacas "travadas" pra exibir = min(produção real, sacas comprometidas)
      const sacasTravadas = Math.min(sacasTotal, sacasComprometidas);

      return {
        prodPotencial, prodReal, sacasTotal, sacasEsperadas,
        sacasTravadas, sacasComprometidas, sacasFaltantes, sacasLivres,
        precoTravado, precoMedioLivre,
        receitaTravada, receitaLivre, indenizacao, receitaBruta,
        custoBackup, custoInsumos, custoManejo, custoSeguro, custoExtra, custoFinanceiro, custoTotal,
        lucro, lucroHa, roe,
        futuroFinal, precoSpot, basisFinal, prodFrustrada
      };
    }

            <div className="flex justify-between items-center">

                  <p><strong className="text-[#D4A574]">Por que importa muito pro produtor</strong>: a soja é uma commodity dolarizada. O preço lá fora (Chicago) é em dólar. Quando o dólar sobe, a soja em reais sobe junto, mesmo sem mudar a cotação internacional.</p>

                  <p><strong className="text-[#D4A574]">Impacto prático</strong>: a 14,50% a.a., um Pronamp de R$ 5 mi custa ~R$ 547 mil em juros até a colheita. Se Selic sobe pra 16%, esse custo vai pra ~R$ 605 mil.</p>

                  <p><strong className="text-[#D4A574]">O que faz mexer</strong>: pico de safra (silo cheio, basis piora), frete (caminhão escasso, basis piora), demanda exportação (China comprando, basis melhora).</p>
                  <p><strong className="text-[#D4A574]">O número</strong>: −R$ 29,82/saca = a soja em Sorriso vale R$ 29,82 a menos que a referência B3.</p>

                  <p><strong className="text-[#D4A574]">Por que importa pro Brasil</strong>: quando o CBOT sobe, a soja brasileira segue (com defasagem de horas e ajustes de prêmio). É o "mercado lá fora" puxando o preço aqui.</p>
                  <p><strong className="text-[#D4A574]">Unidade diferente</strong>: lá é em USD por <em>bushel</em> (≈27,2 kg), aqui é R$ por saca (60 kg). Conversão aproximada: CBOT × 60 ÷ 27,2 × PTAX = preço de paridade da saca.</p>

              </span>
              <span className="text-[#E8E4D5]">{INITIAL_MARKET.cbot.toFixed(2)}</span>
            </div>
          </div>
        </div>
      );

    function AgroGP() {
      const [fase, setFase] = useState('intro');
      const [enso, setEnso] = useState({ actual: null, forecast: null, confidence: null });
      const [decisoes, setDecisoes] = useState({
        area: 1000,
        capital: 6500000,
        pacote: null,
        financiamento: null,
        seguro: null,
        travado: null,
        plantio: null,
        manejo: null,
        venda: null
      });
      const [simState, setSimState] = useState({
        modProd: 1.0,
        modCbot: 1.0,
        modPtax: 1.0,
        modBasis: 0,
        custoExtra: 0
      });
      const [eventLog, setEventLog] = useState([]);
      const [faseEventos, setFaseEventos] = useState([]);

      const dre = useMemo(() => {
        if (fase !== 'dre') return null;
        return calcularDRE(decisoes, simState);
      }, [fase, decisoes, simState]);

      function avancarFase(proxima) {
        // Aplica deriva de mercado (random walk + sazonalidade do basis)
        let novoState = { ...simState };
        if (proxima !== 'dre') {
          novoState = aplicarDeriva(novoState, proxima);
        }

        // Atualiza forecast climático: confidence sobe, e há chance de revisão
        const novoEnso = atualizarForecast(enso, proxima);
        setEnso(novoEnso);

        // Se for tela de eventos, rola eventos da fase base
        if (proxima.endsWith('-eventos')) {
          const faseBase = proxima.replace('-eventos', '');
          const novos = rolarEventosDaFase(faseBase, decisoes, enso.actual);
          novos.forEach(e => e.aplicar(novoState, decisoes));

          // Se houve revisão de forecast nesta fase, insere como evento no topo
          const eventosFinais = [...novos];
          if (novoEnso.revisedThisPhase && novoEnso.prevForecast) {
            const prevLabel = ENSO_REGIMES[novoEnso.prevForecast].label;
            const newLabel = ENSO_REGIMES[novoEnso.forecast].label;
            eventosFinais.unshift({
              id: 'forecast_revisado_' + Date.now(),
              titulo: 'Forecast climático revisado',
              desc: `Modelos meteorológicos atualizados. Agora indicam ${newLabel} (era ${prevLabel}). Confiança subiu pra ${novoEnso.confidence}%.`,
              icon: Info,
              tipo: 'mercado',
              impactoTexto: () => `Confiança ${novoEnso.confidence}% · ${newLabel}`,
              explicacao: 'Forecasts ENSO são atualizados mensalmente pelo CFS/NOAA, INMET e ECMWF. Conforme novos dados de temperatura do Pacífico chegam, os modelos refinam a previsão. Quanto mais próximo da floração, mais precisa fica a leitura do regime.'
            });
          }

          setFaseEventos(eventosFinais);
          setEventLog(prev => [...prev, ...eventosFinais.map(e => ({ ...e, fase: faseBase }))]);
        } else {
          setFaseEventos([]);
        }

        setSimState(novoState);
        setFase(proxima);
      }

      function resetar() {
        setFase('intro');
        setDecisoes({ area: 1000, capital: 6500000, pacote: null, financiamento: null, seguro: null, travado: null, plantio: null, manejo: null, venda: null });
        setSimState({ modProd: 1.0, modCbot: 1.0, modPtax: 1.0, modBasis: 0, custoExtra: 0 });
        setEnso({ actual: null, forecast: null, confidence: null });
        setEventLog([]);
        setFaseEventos([]);
      }

      return (
        <div className="min-h-screen bg-[#0a0c07] text-[#E8E4D5]" style={{ fontFamily: "'Geist', 'Inter', system-ui, sans-serif" }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap');
            .font-display { font-family: 'Fraunces', serif; font-feature-settings: 'ss01'; }
            .font-mono { font-family: 'JetBrains Mono', monospace; }

            /* === TOOLTIP: tudo preto sobre branco, força sobre qualquer cor inline === */
            .tooltip-content,
            .tooltip-content p,
            .tooltip-content span,
            .tooltip-content div,
            .tooltip-content em { color: #000 !important; }
            .tooltip-content strong { color: #6b4d1f !important; font-weight: 700 !important; }
            .tooltip-content em { font-style: italic; color: #3a3a2e !important; }
            /* Caixas de cálculo internas: fundo cinza claro com borda */
            .tooltip-content [class*="bg-[#0f110a]"],
            .tooltip-content [class*="bg-[#15170e]"],
            .tooltip-content [class*="bg-[#1a1c12]"] {
              background-color: #f0ede2 !important;
              border: 1px solid #c8c4b5 !important;

                      <div className="font-medium text-[#E8E4D5]">Vender em 3 janelas (mar/mai/jul)</div>
                      <div className="font-mono text-xs text-[#D4A574]">+2% / −R$ 1,80 arm.</div>
                    </div>
                    <div className="text-xs text-[#8a8a78] leading-snug">Diversifica timing. Caixa entra escalonado. Risco moderado.</div>
                  </Card>
                  <Card selected={decisoes.venda === 'armazenar'} onClick={() => setDecisoes(d => ({ ...d, venda: 'armazenar' }))}>
                    <div className="flex justify-between items-baseline mb-1">
                      <div className="font-medium text-[#E8E4D5]">Armazenar e vender só na entressafra</div>
                      <div className="font-mono text-xs text-[#D4A574]">+4% / −R$ 3,50 arm.</div>
                    </div>
                    <div className="text-xs text-[#8a8a78] leading-snug">Aposta no carrego. Custo de armazenagem alto. Pode ser muito bom ou muito ruim.</div>
                  </Card>
                </div>
                <button
                  disabled={!decisoes.venda}
                  onClick={() => avancarFase('comercializacao-eventos')}
                  className="w-full bg-[#D4A574] disabled:bg-[#2a2c1f] disabled:text-[#5a5a4e] text-[#1a1a13] font-medium py-3 rounded-lg flex items-center justify-center gap-2"
                >
                  comercializar <ArrowRight size={16} />
                </button>
              </div>
            )}

            {/* ====================== DRE FINAL ====================== */}
            {fase === 'dre' && dre && <DREScreen dre={dre} decisoes={decisoes} eventLog={eventLog} onReset={resetar} simState={simState} enso={enso} />}
          </div>
        </div>
      );
    }

    // ============================================================
    // TELA DE EVENTOS DE FASE
    // ============================================================
    function FaseEventosScreen({ fase, decisoes, simState, eventos, onContinuar, labelBotao, enso }) {
      const titulos = {
        'plantio-eventos': { titulo: 'Plantio em andamento', mes: 'Set–Nov', fase: 'plantio' },
        'vegetativo-eventos': { titulo: 'Vegetativo / Floração', mes: 'Dez–Jan', fase: 'vegetativo' },
        'enchimento-eventos': { titulo: 'Enchimento de grão', mes: 'Jan–Fev', fase: 'enchimento' },
        'colheita-eventos': { titulo: 'Colheita', mes: 'Fev–Abr', fase: 'colheita' },
        'comercializacao-eventos': { titulo: 'Comercialização', mes: 'Fev–Jul', fase: 'comercializacao' }
      };
      const meta = titulos[fase];
      return (
        <div className="space-y-4">
          <FaseHeader fase={meta.fase} />
          <MonthLine fase={fase} />
          <ForecastChip enso={enso} />
          <StatBar decisoes={decisoes} simState={simState} />
          <MarketBar simState={simState} />
          <div className="mt-2">
            <div className="text-[#7a7a68] text-[10px] uppercase tracking-widest mb-1">{meta.mes}</div>
            <h2 className="font-display text-xl text-[#E8E4D5]">{meta.titulo}</h2>
          </div>

          {eventos.length === 0 && (
            <div className="bg-[#15170e] border border-[#2a2c1f] rounded p-4 text-center">
              <CheckCircle2 className="text-[#8FB36B] mx-auto mb-2" size={20} />
              <div className="text-[#c8c4b5] text-sm">Sem ocorrências relevantes nesta fase.</div>
            </div>
          )}

          {eventos.length > 0 && (
            <div>
              <div className="text-[#7a7a68] text-[10px] uppercase tracking-widest mb-2">Ocorrências</div>
              {eventos.map(e => <EventoCard key={e.id} evento={e} decisoes={decisoes} />)}
            </div>
          )}

          <button onClick={onContinuar} className="w-full bg-[#D4A574] hover:bg-[#E8B547] text-[#1a1a13] font-medium py-3 rounded-lg flex items-center justify-center gap-2 transition-colors">
            {labelBotao || 'continuar'} <ArrowRight size={16} />
          </button>
        </div>
      );
    }

    // ============================================================
    // TELA DE DRE FINAL
    // ============================================================
    function DREScreen({ dre, decisoes, eventLog, onReset, simState, enso }) {
      const positivo = dre.lucro > 0;

      return (
        <div className="space-y-5">
          <FaseHeader fase="dre" />
          <MonthLine fase="dre" />
          <ForecastChip enso={enso} />
          <MarketBar simState={simState} />

          <div className={`rounded-lg p-5 border ${positivo ? 'bg-gradient-to-br from-[#1f2517] to-[#15170e] border-[#8FB36B]/40' : 'bg-gradient-to-br from-[#25171a] to-[#15170e] border-[#C44536]/40'}`}>
            <div className="text-[#7a7a68] text-[10px] uppercase tracking-widest mb-1">Resultado da safra 25/26</div>
            <div className="flex items-baseline justify-between mb-3">
              <div className={`font-display text-3xl ${positivo ? 'text-[#8FB36B]' : 'text-[#C44536]'}`} style={{ fontStyle: 'italic' }}>
                {fmtBRL(dre.lucro)}
              </div>
              <div className={`text-xs font-mono ${positivo ? 'text-[#8FB36B]' : 'text-[#C44536]'} flex items-center`}>
                ROE {fmtPct(dre.roe)}
                <InfoTip title="ROE — Retorno sobre o capital">
                  <p>Quanto sua safra rendeu em cima do capital que você investiu nela. É a "rentabilidade" do esforço da safra inteira.</p>
                  <p>ROE = Lucro ÷ Capital investido.</p>
                  <p>No simulador, o capital é o caixa que você usou de capital de giro ({fmtBRL(decisoes.capital)}). Se o lucro foi {fmtBRL(dre.lucro)}, o ROE é {fmtPct(dre.roe)}.</p>
                  <p className="text-[#b5b1a0] text-xs mt-3">Pra comparar: CDI numa safra (~10–11% a.a.) é o piso. Um ROE de 25%+ é uma safra muito boa. ROE negativo = você perdeu dinheiro.</p>
                </InfoTip>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2 text-xs font-mono">
              <div className="bg-[#0f110a]/60 rounded p-2">
                <div className="text-[#7a7a68] text-[9px] uppercase tracking-wider">Lucro/ha</div>
                <div className="text-[#E8E4D5] text-sm">{fmtBRL(dre.lucroHa)}</div>
              </div>
              <div className="bg-[#0f110a]/60 rounded p-2">
                <div className="text-[#7a7a68] text-[9px] uppercase tracking-wider">Produtividade</div>
                <div className="text-[#E8E4D5] text-sm">{dre.prodReal.toFixed(1)} sc/ha</div>
              </div>
            </div>
            {dre.prodFrustrada && (
              <div className="mt-3 flex items-center gap-2 text-xs text-[#C97B3F]">
                <AlertTriangle size={12} /> Safra frustrada — seguro acionado.
              </div>
            )}
          </div>

          {/* Decomposição da Receita */}
          <div>
            <h3 className="font-display text-lg mb-2 text-[#D4A574]">
              Receita
              <InfoTip title="Como a receita é formada">
                <p>Sua soja produzida foi vendida em duas partes:</p>
                <p><strong className="text-[#D4A574]">Travado antecipado</strong>: a parte que você fixou preço lá no setup, antes mesmo de plantar. Esse preço já estava garantido — não importa o que aconteceu depois.</p>
                <p><strong className="text-[#D4A574]">Físico vendido</strong>: a parte que ficou "livre". Foi vendida ao preço de mercado do momento (spot na colheita, ou na entressafra se você armazenou).</p>
                <p><strong className="text-[#D4A574]">Indenização de seguro</strong>: se sua produtividade caiu mais de 30% do potencial, o seguro pagou parte do prejuízo.</p>
                <p className="text-[#b5b1a0] text-xs mt-3">A magia tá em combinar bem: travar uma parte (proteção) e deixar outra livre (chance de upside).</p>
              </InfoTip>
            </h3>
            <div className="bg-[#15170e] border border-[#2a2c1f] rounded">
              <RowDRE label="Sacas produzidas" sub={`${dre.prodReal.toFixed(1)} sc/ha × ${decisoes.area} ha`} value={fmtSacas(dre.sacasTotal)} mono />
              <RowDRE
                label={<span className="inline-flex items-center">Travado antecipado ({(decisoes.travado*100).toFixed(0)}%)
                  <InfoTip title="Receita do travamento antecipado">
                    <p>Você comprometeu entregar <strong>{fmtSacas(dre.sacasComprometidas)}</strong> ao preço fixado em agosto.</p>
                    <div className="bg-[#0f110a] rounded p-2 font-mono text-xs mt-2 space-y-1">
                      <div className="flex justify-between"><span className="text-[#8a8a78]">Esperado produzir</span><span>{fmtSacas(dre.sacasEsperadas)}</span></div>
                      <div className="flex justify-between"><span className="text-[#8a8a78]">× {(decisoes.travado*100).toFixed(0)}% travado</span><span>{fmtSacas(dre.sacasComprometidas)}</span></div>
                      <div className="flex justify-between"><span className="text-[#8a8a78]">× preço travado</span><span>{fmtBRL(dre.precoTravado, 2)}</span></div>
                      <div className="flex justify-between pt-1 border-t border-[#2a2c1f]"><span className="text-[#D4A574]">Receita</span><span className="text-[#D4A574]">{fmtBRL(dre.receitaTravada)}</span></div>
                    </div>
                    <p className="text-[#b5b1a0] text-xs mt-3">O contrato é quantidade fixa — não importa o que você efetivamente produziu, o comprador exige as sacas comprometidas.</p>
                  </InfoTip>
                </span>}
                sub={`${fmtSacas(dre.sacasComprometidas)} × ${fmtBRL(dre.precoTravado, 2)}`}
                value={fmtBRL(dre.receitaTravada)}
              />
              <RowDRE label="Físico livre vendido" sub={`${fmtSacas(dre.sacasLivres)} × ${fmtBRL(dre.precoMedioLivre, 2)}`} value={fmtBRL(dre.receitaLivre)} />
              {dre.indenizacao > 0 && <RowDRE label="Indenização de seguro" value={fmtBRL(dre.indenizacao)} positivo />}
              <RowDRE label="Receita bruta" value={fmtBRL(dre.receitaBruta)} total />
            </div>
          </div>

          {/* Custos */}
          <div>
            <h3 className="font-display text-lg mb-2 text-[#D4A574]">
              Custos
              <InfoTip title="Como os custos são formados">
                <p>Os custos da safra se dividem em cinco grupos, cada um com lógica própria:</p>
                <p><strong className="text-[#D4A574]">Insumos</strong>: o pacote tecnológico × área plantada.</p>
                <p><strong className="text-[#D4A574]">Manejo fito</strong>: o programa de defensivos × área.</p>
                <p><strong className="text-[#D4A574]">Seguro</strong>: prêmio (% do custo de insumos) cobrado pela seguradora.</p>
                <p><strong className="text-[#D4A574]">Custos extras (clima)</strong>: gastos não planejados gerados por eventos (replantio, operações extras).</p>
                <p><strong className="text-[#D4A574]">Custo financeiro</strong>: juros do financiamento ou ágio do barter sobre os insumos+manejo.</p>
              </InfoTip>
            </h3>
            <div className="bg-[#15170e] border border-[#2a2c1f] rounded">
              <RowDRE
                label={<span className="inline-flex items-center">Insumos
                  <InfoTip title="Custo de insumos">
                    <p>Sementes, adubo, defensivos e tratamento — o pacote tecnológico que você escolheu, multiplicado pela área plantada.</p>
                    <div className="bg-[#0f110a] rounded p-2 font-mono text-xs mt-2 space-y-1">
                      <div className="flex justify-between"><span className="text-[#8a8a78]">Pacote {PACOTES[decisoes.pacote].label}</span><span>{fmtBRL(PACOTES[decisoes.pacote].custoHa)}/ha</span></div>
                      <div className="flex justify-between"><span className="text-[#8a8a78]">× Área</span><span>{decisoes.area} ha</span></div>
                      <div className="flex justify-between pt-1 border-t border-[#2a2c1f]"><span className="text-[#D4A574]">Total</span><span className="text-[#D4A574]">{fmtBRL(dre.custoInsumos)}</span></div>
                    </div>
                  </InfoTip>
                </span>}
                value={`(${fmtBRL(dre.custoInsumos)})`} negativo
              />
              <RowDRE
                label={<span className="inline-flex items-center">Manejo fito
                  <InfoTip title="Custo do manejo fitossanitário">
                    <p>Aplicações extras de fungicida e inseticida, além do que já está no pacote básico. Programa preventivo ou premium adiciona custo, mas reduz perdas por ferrugem, lagarta e percevejo.</p>
                    <div className="bg-[#0f110a] rounded p-2 font-mono text-xs mt-2 space-y-1">
                      <div className="flex justify-between"><span className="text-[#8a8a78]">Programa {MANEJOS[decisoes.manejo].label}</span><span>{fmtBRL(MANEJOS[decisoes.manejo].custoHa)}/ha</span></div>
                      <div className="flex justify-between"><span className="text-[#8a8a78]">× Área</span><span>{decisoes.area} ha</span></div>
                      <div className="flex justify-between pt-1 border-t border-[#2a2c1f]"><span className="text-[#D4A574]">Total</span><span className="text-[#D4A574]">{fmtBRL(dre.custoManejo)}</span></div>
                    </div>
                  </InfoTip>
                </span>}
                value={`(${fmtBRL(dre.custoManejo)})`} negativo
              />
              <RowDRE
                label={<span className="inline-flex items-center">Seguro
                  <InfoTip title="Custo do seguro agrícola">
                    <p>Prêmio que você pagou pra ter cobertura caso a safra quebrasse. Pago integralmente, mesmo em ano bom.</p>
                    <div className="bg-[#0f110a] rounded p-2 font-mono text-xs mt-2 space-y-1">
                      <div className="flex justify-between"><span className="text-[#8a8a78]">{SEGUROS[decisoes.seguro].label}</span><span>{(SEGUROS[decisoes.seguro].custoPct*100).toFixed(1)}%</span></div>
                      <div className="flex justify-between"><span className="text-[#8a8a78]">× Custo de insumos</span><span>{fmtBRL(dre.custoInsumos)}</span></div>
                      <div className="flex justify-between pt-1 border-t border-[#2a2c1f]"><span className="text-[#D4A574]">Total</span><span className="text-[#D4A574]">{fmtBRL(dre.custoSeguro)}</span></div>
                    </div>
                    {dre.indenizacao > 0 && <p className="text-xs text-[#8FB36B] mt-2">✓ Indenização recebida: {fmtBRL(dre.indenizacao)} (aparece na receita).</p>}
                  </InfoTip>
                </span>}
                value={`(${fmtBRL(dre.custoSeguro)})`} negativo
              />
              <RowDRE
                label={<span className="inline-flex items-center">Custos extras (clima)
                  <InfoTip title="Custos extras gerados por eventos">
                    <p>Gastos não planejados que aparecem por causa de eventos do clima — replantio, operações extras de aplicação, secagem de grão úmido.</p>
                    {dre.custoExtra > 0 ? (
                      <div className="bg-[#0f110a] rounded p-2 font-mono text-xs mt-2 space-y-1">
                        <div className="flex justify-between"><span className="text-[#8a8a78]">R$ {(dre.custoExtra / decisoes.area).toFixed(0)}/ha</span><span>× {decisoes.area} ha</span></div>
                        <div className="flex justify-between pt-1 border-t border-[#2a2c1f]"><span className="text-[#D4A574]">Total</span><span className="text-[#D4A574]">{fmtBRL(dre.custoExtra)}</span></div>
                      </div>
                    ) : (
                      <p className="text-[#8FB36B] text-xs mt-2">✓ Nenhum evento gerou custo extra nessa safra.</p>
                    )}
                  </InfoTip>
                </span>}
                value={`(${fmtBRL(dre.custoExtra)})`} negativo
              />
              <RowDRE
                label={<span className="inline-flex items-center">Custo financeiro
                  <InfoTip title="Custo financeiro do financiamento">
                    <p>Juros do Pronamp ou ágio do barter sobre o valor financiado. Cobrado apenas sobre insumos e manejo (seguro é pago à vista).</p>
                    <div className="bg-[#0f110a] rounded p-2 font-mono text-xs mt-2 space-y-1">
                      <div className="flex justify-between"><span className="text-[#8a8a78]">{FINANCIAMENTOS[decisoes.financiamento].label}</span><span>{(FINANCIAMENTOS[decisoes.financiamento].custoFin*100).toFixed(1)}%</span></div>
                      <div className="flex justify-between"><span className="text-[#8a8a78]">× (Insumos + Manejo)</span><span>{fmtBRL(dre.custoInsumos + dre.custoManejo)}</span></div>
                      <div className="flex justify-between pt-1 border-t border-[#2a2c1f]"><span className="text-[#D4A574]">Total</span><span className="text-[#D4A574]">{fmtBRL(dre.custoFinanceiro)}</span></div>
                    </div>
                    {decisoes.financiamento === 'avista' && <p className="text-[#8FB36B] text-xs mt-2">✓ À vista = sem custo financeiro.</p>}
                  </InfoTip>
                </span>}
                value={`(${fmtBRL(dre.custoFinanceiro)})`} negativo
              />
              {dre.custoBackup > 0 && (
                <RowDRE
                  label={<span className="inline-flex items-center text-[#C44536]">⚠ Backup contratual
                    <InfoTip title="Backup contratual — quebra de hedge">
                      <p>Você travou mais sacas do que conseguiu produzir. Pra honrar o contrato, teve que <strong>comprar soja no mercado</strong> ao preço spot atual.</p>
                      <div className="bg-[#0f110a] rounded p-2 font-mono text-xs mt-2 space-y-1">
                        <div className="flex justify-between"><span className="text-[#8a8a78]">Comprometido entregar</span><span>{fmtSacas(dre.sacasComprometidas)}</span></div>
                        <div className="flex justify-between"><span className="text-[#8a8a78]">Produziu</span><span>{fmtSacas(dre.sacasTotal)}</span></div>
                        <div className="flex justify-between"><span className="text-[#C44536]">Faltou</span><span className="text-[#C44536]">{fmtSacas(dre.sacasFaltantes)}</span></div>
                        <div className="flex justify-between"><span className="text-[#8a8a78]">× preço spot</span><span>{fmtBRL(dre.precoSpot, 2)}</span></div>
                        <div className="flex justify-between pt-1 border-t border-[#2a2c1f]"><span className="text-[#C44536]">Backup</span><span className="text-[#C44536]">{fmtBRL(dre.custoBackup)}</span></div>
                      </div>
                      <p className="text-[#b5b1a0] text-xs mt-3">Isso é o "preço" de hedge agressivo em ano ruim. Se o forecast indicava risco e você travou mais de 50% mesmo assim, o resultado é esse.</p>
                    </InfoTip>
                  </span>}
                  value={`(${fmtBRL(dre.custoBackup)})`}
                  negativo
                />
              )}
              <RowDRE label="Custo total" value={`(${fmtBRL(dre.custoTotal)})`} total />
            </div>
          </div>

          {/* Mercado final */}
          <div>
            <h3 className="font-display text-lg mb-2 text-[#D4A574]">
              Mercado no fechamento
              <InfoTip title="Mercado no fechamento">
                <p>É a "fotografia" do mercado da soja no momento em que a sua safra terminou — pra você comparar com o que escolheu lá atrás.</p>
                <p><strong className="text-[#D4A574]">Futuro final</strong>: cotação do contrato futuro da soja na B3 no fechamento da safra. É a referência nacional, em R$ por saca de 60kg.</p>
                <p><strong className="text-[#D4A574]">Spot MT</strong>: preço físico real em Sorriso/MT. Sempre menor que o futuro porque a soja precisa ser transportada até o porto. <em>Spot = Futuro + Basis</em>.</p>
                <p><strong className="text-[#D4A574]">Basis final</strong>: a "diferença regional" naquele momento. Quanto vale a soja em Sorriso vs a referência B3. Quando frete sobe ou silo enche, o basis fica mais negativo.</p>
                <p><strong className="text-[#D4A574]">vs travado</strong>: comparação entre o preço que você travou no setup e o spot atual. Se o spot terminou mais baixo que o seu travamento, você "travou bem" — vendeu mais caro do que conseguiria hoje. Se o spot subiu acima do travado, você perdeu upside.</p>
                <p className="text-[#b5b1a0] text-xs mt-3">Exemplo: você travou em R$118 lá no início. O spot terminou em R$111. Você ganhou R$7 por saca vs vender hoje. ✓ Travou bem.</p>
              </InfoTip>
            </h3>
            <div className="bg-[#0f110a] border border-[#2a2c1f] rounded p-3 font-mono text-xs grid grid-cols-2 gap-x-3 gap-y-1.5">
              <div className="flex justify-between"><span className="text-[#8a8a78]">Futuro final</span><span className="text-[#E8E4D5]">{dre.futuroFinal.toFixed(2)}</span></div>
              <div className="flex justify-between"><span className="text-[#8a8a78]">Spot MT</span><span className="text-[#E8E4D5]">{dre.precoSpot.toFixed(2)}</span></div>
              <div className="flex justify-between"><span className="text-[#8a8a78]">Basis final</span><span className="text-[#E8E4D5]">{dre.basisFinal.toFixed(2)}</span></div>
              <div className="flex justify-between"><span className="text-[#8a8a78]">vs travado</span><span className={dre.precoSpot > dre.precoTravado ? 'text-[#C44536]' : 'text-[#8FB36B]'}>{dre.precoSpot > dre.precoTravado ? 'perdeu upside' : 'travou bem'}</span></div>
            </div>
          </div>

          {/* Histórico de eventos */}
          <div>
            <h3 className="font-display text-lg mb-2 text-[#D4A574]">A safra em eventos</h3>
            {eventLog.length === 0 ? (
              <div className="text-[#7a7a68] text-sm">Safra sem grandes surpresas.</div>
            ) : (
              <div className="space-y-1">
                {eventLog.map((e, i) => (
                  <div key={i} className="flex items-start gap-2 text-xs py-1.5 border-b border-[#2a2c1f]/50 last:border-0">
                    <e.icon size={12} className="mt-0.5 flex-shrink-0" style={{ color: TIPO_COR[e.tipo] }} />
                    <div className="flex-1 text-[#c8c4b5]">{e.titulo}</div>
                    <div className="text-[#5a5a4e] font-mono text-[10px] uppercase">{e.fase}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <button onClick={onReset} className="w-full bg-[#D4A574] hover:bg-[#E8B547] text-[#1a1a13] font-medium py-3 rounded-lg flex items-center justify-center gap-2 transition-colors">
            <RotateCcw size={16} /> jogar outra safra
          </button>
        </div>
      );
    }

    function RowDRE({ label, sub, value, total, negativo, positivo, mono }) {
      return (
        <div className={`flex justify-between items-baseline px-3 py-2.5 border-b border-[#2a2c1f]/60 last:border-0 ${total ? 'bg-[#1a1c12]' : ''}`}>
          <div className="flex-1 min-w-0">
            <div className={`text-sm ${total ? 'text-[#E8E4D5] font-medium' : 'text-[#c8c4b5]'}`}>{label}</div>
            {sub && <div className="text-[10px] text-[#7a7a68] font-mono mt-0.5">{sub}</div>}
          </div>
          <div className={`font-mono text-sm ${total ? 'text-[#D4A574] font-medium' : negativo ? 'text-[#C97B3F]' : positivo ? 'text-[#8FB36B]' : 'text-[#E8E4D5]'}`}>
            {value}
          </div>
        </div>
      );
    }

/* === FIM DO COMPONENTE === */

    try {
      document.getElementById('loading')?.remove();
      __createRoot(document.getElementById('root')).render(<AgroGP />);
    } catch (err) {
      const l = document.getElementById('loading') || document.getElementById('root');
      if (l) {
        l.innerHTML = '<div style="padding:20px; font-family:monospace; font-size:13px; color:#ff8a65; max-width:90vw; word-break:break-word; line-height:1.5;">' +
          '<div style="color:#D4A574; font-size:16px; margin-bottom:12px; font-family:serif; font-style:italic;">Erro ao renderizar</div>' +
          '<div>' + (err.message || err) + '</div>' +
          (err.stack ? '<div style="margin-top:8px; color:#7a7a68; white-space:pre-wrap;">' + err.stack + '</div>' : '') +
          '</div>';
      }
      throw err;
    }
  </script>
</body>
</html>
